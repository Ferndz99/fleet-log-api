<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Invitación a la empresa</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background-color: #f9fafb; padding: 24px;">

    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">

                <table width="600" cellpadding="0" cellspacing="0"
                       style="background-color: #ffffff; border-radius: 8px; padding: 24px;">

                    <tr>
                        <td>
                            <h2 style="color: #111827;">
                                Has sido invitado a unirte a
                                <strong>{{ company_name }}</strong>
                            </h2>

                            <p style="color: #374151; font-size: 15px;">
                                Te han invitado a formar parte de la empresa
                                <strong>{{ company_name }}</strong>.
                            </p>

                            <p style="margin: 32px 0; text-align: center;">
                                <a href="{{ invite_url }}"
                                   style="
                                       display: inline-block;
                                       padding: 12px 20px;
                                       background-color: #4f46e5;
                                       color: #ffffff;
                                       text-decoration: none;
                                       border-radius: 6px;
                                       font-weight: 600;
                                   ">
                                    Aceptar invitación
                                </a>
                            </p>

                            <p style="color: #6b7280; font-size: 14px;">
                                Si el botón no funciona, copia y pega este enlace en tu navegador:
                            </p>

                            <p style="word-break: break-all; color: #2563eb; font-size: 14px;">
                                {{ invite_url }}
                            </p>

                            <hr style="margin: 32px 0; border: none; border-top: 1px solid #e5e7eb;">

                            <p style="color: #9ca3af; font-size: 12px;">
                                Si no esperabas este correo, puedes ignorarlo sin problema.
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
